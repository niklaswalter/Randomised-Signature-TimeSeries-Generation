seed: 0

evaluation:
  n_samples: 2000        # generated paths used for the metrics; matches the test set size

mlflow:
  tracking_uri: "./mlruns"
  experiment_name: "RSIG-Generator-Test"

timeseries: 
  n_lags: 10
  data_dim: 1
  p: 6
  q: 10

bm:
  samples: 10000
  drift: 0.0
  std: 1.0
  T: 1         # h = T / n_lags = 0.1: Euler discretisation on [0, 1]

gbm:
  samples: 50000
  drift: 0.0
  std: 1.0
  initial_value_gbm: 1.0

ar:
  samples: 50000
  phi: -0.1
  std: 1.0

hyperparameters:
  learning_rate: 1e-3
  gradient_steps: 5000
  batch_size: 1500
  mc_num: 1000
  past_chunk: 256
  checkpoint_every: 100
  checkpoint_samples: 4096
  checkpoint_seed: 12345

rsigw1: 
  reservoir_dim_metric: 80
  terminal_diff: True

rsigcw1: 
  reservoir_dim_metric: 80
  terminal_diff: True

sigw1:
  truncation_depth: 4
  normalise: True

sigcw1:
  truncation_depth: 4
  augmented: True

conditional_evaluation:
  n_eval: 100
  samples_per_past: 200

neural_sde:
  input_dim: 5
  hidden_dim: 32
  brownian_dim: 1
  reservoir_dim_gen: 80
  activation: "ShiftedSigmoid"

lstm:
  input_dim: 5
  hidden_dim: 64
  num_layers: 2

cond_neural_sde:
  input_dim: 5
  hidden_dim: 32
  brownian_dim: 1
  reservoir_dim_gen: 80
  initial_noise_dim: 40
  activation: "ShiftedSigmoid"
  terminal_diff: True

data: 
  id: "BM"
  ratio_train: 0.7
  ratio_val: 0.1

generator:
  id: "NeuralSDE"

discriminator:
  id: "RSigW1"

others: 
  trainable_var: True           # rho_5 trainable: the paper notes this helps for small-variance paths
  same_matrices: True           # generator reuses the RSig-W1 reservoir matrices
  time_homogeneous_readout: False
