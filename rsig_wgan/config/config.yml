mlflow:
  tracking_uri: "./mlruns"
  experiment_name: "RSIG-Generator-Test"

timeseries: 
  n_lags: 10
  data_dim: 1
  p: 6
  q: 10

bm:
  samples: 10000
  drift: 0.0
  std: 1.0
  T: 10        # T / n_lags = 1 gives the unit time steps of eq. (30)

gbm:
  samples: 50000
  drift: 0.0
  std: 1.0
  initial_value_gbm: 1.0

ar:
  samples: 50000
  phi: -0.1
  std: 1.0

hyperparameters:
  learning_rate: 1e-4
  gradient_steps: 2500
  batch_size: 1500
  mc_num: 1000
  past_chunk: 256

rsigw1: 
  reservoir_dim_metric: 80

rsigcw1: 
  reservoir_dim_metric: 80

sigw1:
  truncation_depth: 4
  normalise: True

sigcw1:
  truncation_depth: 4
  augmented: True

conditional_evaluation:
  n_eval: 100
  samples_per_past: 200

neural_sde:
  input_dim: 5
  hidden_dim: 32
  brownian_dim: 1
  reservoir_dim_gen: 80
  activation: "Sigmoid"

lstm:
  input_dim: 5
  hidden_dim: 64
  num_layers: 2

cond_neural_sde:
  input_dim: 5
  hidden_dim: 32
  brownian_dim: 1
  reservoir_dim_gen: 80
  initial_noise_dim: 40
  activation: "Sigmoid"

data: 
  id: "BM"
  ratio_train: 0.8
  ratio_val: 0.0

generator:
  id: "NeuralSDE"

discriminator:
  id: "RSigW1"

others: 
  trainable_var: False          # the paper fixes rho_5 = 1 throughout Section 3.2
  same_matrices: False
  time_homogeneous_readout: False
